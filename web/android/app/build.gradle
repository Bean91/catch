apply plugin: 'com.android.application'

android {
    // `catch` is a Java keyword, so the product id com.openoted.catch cannot be a Java package; the code lives in
    // com.openoted.catchapp and only the applicationId (what Play, assetlinks.json and push see) is com.openoted.catch.
    namespace = "com.openoted.catchapp"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.openoted.catch"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // The host the verified App Links claim; override per build: ./gradlew assembleProdRelease -PcatchHost=catch.example.com
        manifestPlaceholders = [catchHost: (project.findProperty("catchHost") ?: "catch.openoted.com")]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    flavorDimensions "env"
    productFlavors {
        // The environment decides only the id suffix and the launcher label: dev/staging install beside the store build.
        // The web bundle (and so the API it talks to) is chosen separately: `npm run native:sync` with CATCH_NATIVE_ENV.
        prod {
            dimension "env"
            resValue "string", "app_name", "Catch"
            resValue "string", "title_activity_main", "Catch"
            resValue "string", "package_name", "com.openoted.catch"
            resValue "string", "custom_url_scheme", "com.openoted.catch"
        }
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            resValue "string", "app_name", "Catch Staging"
            resValue "string", "title_activity_main", "Catch Staging"
            resValue "string", "package_name", "com.openoted.catch.staging"
            resValue "string", "custom_url_scheme", "com.openoted.catch.staging"
        }
        dev {
            dimension "env"
            applicationIdSuffix ".dev"
            resValue "string", "app_name", "Catch Dev"
            resValue "string", "title_activity_main", "Catch Dev"
            resValue "string", "package_name", "com.openoted.catch.dev"
            resValue "string", "custom_url_scheme", "com.openoted.catch.dev"
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
