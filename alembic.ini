# Public (Supabase Postgres) schema migrations only — the Pi's SQLite file is managed by catch/core/db.py.
# The URL is never stored here: set DATABASE_ADMIN_URL (an admin/migration role, never the runtime catch_api role).
[alembic]
script_location = migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
