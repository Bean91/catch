[project]
name = "catch"
version = "0.1.0"
description = "Self-hosted rowing training app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
    "argon2-cffi>=23",
    # Both are pure-Python wheels; their compiled transitive deps (jiter, pydantic-core) ship
    # manylinux aarch64 *and* armv7l wheels on PyPI (checked before adding, per CLAUDE.md's Pi
    # 3 ARM rule) — safe on a 32- or 64-bit Pi OS. Both are lazy-imported (catch/coach/providers/
    # anthropic_provider.py, catch/mcp_server/) so a Pi that never opens the Coach pays nothing.
    "anthropic>=2.0",
    "mcp>=1.2",
    # Session 8/12 (see PLAN.md): per-sample FIT parsing for real time-in-zone/strain.
    # py3-none-any wheel on PyPI (checked before adding) — pure Python, no ARM concerns.
    "fitdecode>=0.11",
    # Session 16 (see PLAN.md Part A): Web Push — `py-vapid` (VAPID JWT signing) and
    # `http-ece` (the RFC 8188 aes128gcm payload encryption Web Push requires) directly,
    # rather than the full `pywebpush` package, which transitively pulls in `requests` *and*
    # `aiohttp` (and aiohttp's own compiled deps: multidict/yarl/frozenlist) for a `.send()`
    # method this app never calls — the actual POST to the push service goes through httpx
    # directly (catch/notify/push.py), so the existing live-call guard (tests/conftest.py,
    # httpx-only) covers it for free. Both are pure-Python py3-none-any wheels on PyPI
    # (checked before adding) — no ARM concern. Lazy-imported (catch/notify/push.py) so a Pi
    # that never enables push pays nothing.
    "py-vapid>=1.9",
    "http-ece>=1.2",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
# Deliberately small: this codebase's comment style (CLAUDE.md's "why, not what") runs long
# lines by design, and import-sorting churn isn't worth it for a single-contributor repo.
# Pyflakes (F) plus a few high-signal pycodestyle checks (E7xx logic bugs), nothing stylistic.
select = ["E7", "E9", "F"]
ignore = ["E741"]

[project.scripts]
catch = "catch.cli:main"
catch-mcp = "catch.mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catch"]
