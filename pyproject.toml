[project]
name = "catch"
version = "0.1.0"
description = "Self-hosted rowing training app"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sqlmodel>=0.0.22",
    "httpx>=0.27",
    "apscheduler>=3.10,<4",
    "cryptography>=43",
    "argon2-cffi>=23",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
catch = "catch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["catch"]
