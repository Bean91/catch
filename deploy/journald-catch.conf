# Installed by pi-bootstrap.sh at /etc/systemd/journald.conf.d/catch.conf. This is a
# system-wide journald setting (there's only one journald) but it only *caps* total disk
# usage — it doesn't touch Storage= or anything that would change PiAware's own logging
# behavior, so it's additive/shared-safe, not a PiAware reconfiguration.
[Journal]
SystemMaxUse=50M
