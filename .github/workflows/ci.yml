name: CI

on:
  push:
  pull_request:

# Everything here runs against fixtures/mocks only — no secrets are configured on this
# workflow, and none are needed (CLAUDE.md: "no live network calls in the suite"). The Python
# suite's live-call guard (tests/conftest.py) would turn any accidental real call into a hard
# failure rather than a silent flake.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Syntax-check the generated service worker
        # Nothing else exercises sw.js's template-string-generated JS before it ships — a
        # syntax error in vite.config.ts's serviceWorkerPlugin would otherwise only surface
        # as a silent registration failure in a real browser (breaking offline + the update
        # flow), not a build error.
        run: node --check ../catch/api/static/sw.js
      - run: npm run check:bundle-size
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
