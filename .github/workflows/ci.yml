name: CI

on:
  push:
  pull_request:

# Read-only token for every job: nothing here pushes, comments or publishes.
permissions:
  contents: read

# Superseded runs on the same branch cancel automatically — a push while a prior run is
# still going (or stuck, e.g. a slow/hung Playwright-browser download) no longer piles up
# redundant or stale in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Everything here runs against fixtures/mocks only — no secrets are configured on this
# workflow, and none are needed (CLAUDE.md: "no live network calls in the suite"). The Python
# suite's live-call guard (tests/conftest.py) would turn any accidental real call into a hard
# failure rather than a silent flake.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups --all-extras
      - run: uv run ruff check .
      - run: uv run pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: The built bundle must not contain a Supabase secret (service-role) key
        run: "! grep -rIl -e 'sb_secret_' -e 'service_role' ../catch/api/static"
      - name: The built bundle must not contain a database URL or secret key (checked by name, never printed)
        run: npm run check:build-secrets
      - name: Syntax-check the generated service worker
        # Nothing else exercises sw.js's template-string-generated JS before it ships — a
        # syntax error in vite.config.ts's serviceWorkerPlugin would otherwise only surface
        # as a silent registration failure in a real browser (breaking offline + the update
        # flow), not a build error.
        run: node --check ../catch/api/static/sw.js
      - run: npm run check:bundle-size
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
