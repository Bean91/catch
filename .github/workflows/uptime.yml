name: Uptime

# External uptime check on the public deployment (launch audit B-8). A failed run is the alert: GitHub e-mails the person who last
# changed this schedule. GitHub runs schedules late under load and disables them after 60 days without repository activity.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET /api/health
        # Retries ride out a scale-to-zero cold start; three failures in a row means it is really down.
        run: |
          curl -fsS --retry 3 --retry-delay 20 --retry-all-errors --max-time 30 \
            https://catch.openoted.com/api/health
